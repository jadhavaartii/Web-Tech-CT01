<!DOCTYPE html>
<html>
<head>
    <title>Inline CSS Demonstration</title>
</head>

<body>

    <h1 style="color: blue; text-align: center;">
        Registration Form
    </h1>

    <p style="color: green; font-size: 18px;">
        Please fill in the following details to register.
    </p>

    <form>
        <label style="font-weight: bold;">Name:</label>
        <input type="text" style="border: 2px solid blue; padding: 8px;">

        <br><br>

        <label style="font-weight: bold;">Email:</label>
        <input type="email" style="border: 2px solid blue; padding: 8px;">

        <br><br>

        <button style="background-color: blue; color: white; padding: 10px 20px; border: none;">
            Register
        </button>
    </form>

</body>
</html>
